# Dependency updates. Everything (major included) arrives as one grouped PR per
# ecosystem, so a weekly round is a single lockfile/manifest diff to review
# instead of one PR per semver-major. Dependabot cannot group across
# ecosystems, so the floor is three PRs (cargo / npm / github-actions); majors
# that need real migration work are still consolidated by hand (see #122).
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]

  - package-ecosystem: npm
    directory: "/agentj-ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
