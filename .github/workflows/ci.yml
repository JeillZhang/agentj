name: ci
on:
  pull_request:
    # `labeled` is what makes the `desktop-package` label gate below usable: a label added
    # after the PR was opened only reaches the jobs through a fresh event.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  # Coverage ratchet: measured 2026-10-23 at 93.67% line coverage, so the gate
  # is max(50, floor(93.67) - 1) = 92. Only ever raise this value (in the PR
  # that lifts coverage); never lower it to make a red build green.
  COVERAGE_THRESHOLD: 92
jobs:
  lint:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The assert scripts need cargo-deny themselves (deny-config would otherwise
      # report SKIP), and every invocation below runs with --strict so a SKIP is
      # a failure instead of a silent green.
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Repo invariants
        run: |
          python3 -m pip install --user pyyaml
          bash scripts/tests/assert-ui.sh --strict
          bash scripts/tests/assert-cargo.sh --strict
          bash scripts/tests/assert-ci.sh --strict
  test:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p agentj-plugin-fixture
      - run: cargo test --workspace --locked
  deny:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - uses: Swatinem/rust-cache@v2
      # `-D unmatched-skip`: a stale bans.skip entry is only a warning by default,
      # so the guard would silently rot instead of failing the build.
      - run: cargo deny check advisories licenses bans sources -D unmatched-skip
  cross-platform:
    if: github.event.action != 'labeled'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --workspace --locked
  coverage:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked -p agentj-plugin-fixture
      - run: cargo llvm-cov --workspace --fail-under-lines ${{ env.COVERAGE_THRESHOLD }} --lcov --output-path lcov.info --locked
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info
  frontend:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agentj-ui/package-lock.json
      - run: npm --prefix agentj-ui ci
      - run: npm --prefix agentj-ui run generate --workspace=@agentj/protocol
      - run: git diff --exit-code -- agentj-ui/packages/protocol/types.d.ts
      - run: npm --prefix agentj-ui run build --workspace=@agentj/protocol
      - run: npm --prefix agentj-ui test --workspace=@agentj/protocol
      - run: npm --prefix agentj-ui run generate --workspace=@agentj/sdk
      - run: git diff --exit-code -- agentj-ui/packages/sdk/src/methods.ts
      - run: npm --prefix agentj-ui test --workspace=@agentj/sdk
      - run: npm --prefix agentj-ui test --workspace=@agentj/tokens
      - run: npm --prefix agentj-ui test --workspace=@agentj/web
      - run: npm --prefix agentj-ui run build --workspace=@agentj/web
      - name: dist <-> protocol version
        run: |
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('agentj-ui/apps/web/dist/version.json'));const m=JSON.parse(fs.readFileSync('protocol/methods.json'));if(v.protocol_version!==m.protocol_version){console.error('dist',v.protocol_version,'!= methods',m.protocol_version);process.exit(1)}"
      # oxlint: errors gate the build, warnings stay visible in the log.
      - run: npm --prefix agentj-ui run lint --workspace=@agentj/web
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun --cwd agentj-ui/apps/tui test
      - run: node agentj-ui/apps/desktop/check-desktop-ui.mjs
      - run: ./scripts/check-version.sh
      - run: node scripts/check-relocate.mjs
  # Linux desktop packaging: proves `tauri build` still produces installable
  # artifacts. `cross-platform` stays build-only; bundling lives here alone.
  desktop-package:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agentj-ui/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix agentj-ui ci
      - name: Build protocol types
        run: npm --prefix agentj-ui run generate --workspace=@agentj/protocol
      - name: Build sdk types
        run: npm --prefix agentj-ui run generate --workspace=@agentj/sdk
      - name: Build web assets
        run: npm --prefix agentj-ui run build --workspace=@agentj/web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agentj-ui/apps/desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build desktop bundles
        run: npm --prefix agentj-ui/apps/desktop run build -- --bundles deb,appimage
      - name: Verify artifacts
        run: ./agentj-ui/apps/desktop/check-artifacts.sh linux
      - uses: actions/upload-artifact@v7
        with:
          name: agentj-desktop-linux
          path: |
            agentj-ui/apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            agentj-ui/apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7
          if-no-files-found: error

  # Cross-platform bundles are label-gated and never run by default: macOS/Windows
  # runners are ~10x the cost of `ubuntu-latest`, so they only fire when a PR carries
  # the `desktop-package` label or the whole workflow is dispatched by hand. `dmg`/`msi`
  # are the native installers the four-artifact contract promises.
  desktop-package-macos:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'desktop-package')
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agentj-ui/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix agentj-ui ci
      - name: Build protocol types
        run: npm --prefix agentj-ui run generate --workspace=@agentj/protocol
      - name: Build sdk types
        run: npm --prefix agentj-ui run generate --workspace=@agentj/sdk
      - name: Build web assets
        run: npm --prefix agentj-ui run build --workspace=@agentj/web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agentj-ui/apps/desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build desktop bundles
        run: npm --prefix agentj-ui/apps/desktop run build -- --bundles dmg
      - name: Verify artifacts
        shell: bash
        run: ./agentj-ui/apps/desktop/check-artifacts.sh macos
      - uses: actions/upload-artifact@v7
        with:
          name: agentj-desktop-macos
          path: agentj-ui/apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 7
          if-no-files-found: error

  desktop-package-windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'desktop-package')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agentj-ui/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix agentj-ui ci
      - name: Build protocol types
        run: npm --prefix agentj-ui run generate --workspace=@agentj/protocol
      - name: Build sdk types
        run: npm --prefix agentj-ui run generate --workspace=@agentj/sdk
      - name: Build web assets
        run: npm --prefix agentj-ui run build --workspace=@agentj/web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agentj-ui/apps/desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build desktop bundles
        run: npm --prefix agentj-ui/apps/desktop run build -- --bundles msi
      - name: Verify artifacts
        shell: bash
        run: ./agentj-ui/apps/desktop/check-artifacts.sh windows
      - uses: actions/upload-artifact@v7
        with:
          name: agentj-desktop-windows
          path: agentj-ui/apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7
          if-no-files-found: error
