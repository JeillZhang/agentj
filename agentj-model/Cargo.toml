[package]
name = "agentj-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
agentj-core = { path = "../agentj-core" }
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }

[dev-dependencies]
futures = "0.3"
wiremock = "0.6"
