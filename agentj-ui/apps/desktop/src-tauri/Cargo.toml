[package]
name = "agentj-ui"
version = "0.29.10"
description = "AgentJ UI desktop shell"
authors = ["AgentJ"]
edition = "2021"
rust-version = "1.77"
default-run = "agentj-ui"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[workspace]
