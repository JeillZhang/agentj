[package]
name = "agentj-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "agentj"
path = "src/main.rs"

[dependencies]
agentj-auth = { path = "../agentj-auth" }
agentj-core = { path = "../agentj-core" }
agentj-config = { path = "../agentj-config" }
agentj-context = { path = "../agentj-context" }
agentj-ipc = { path = "../agentj-ipc" }
agentj-model = { path = "../agentj-model" }
agentj-permission = { path = "../agentj-permission" }
agentj-question = { path = "../agentj-question" }
agentj-session = { path = "../agentj-session" }
agentj-stats = { path = "../agentj-stats" }
agentj-tools = { path = "../agentj-tools" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
agentj-skills = { path = "../agentj-skills" }
agentj-mcp = { path = "../agentj-mcp" }
agentj-license = { path = "../agentj-license" }
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }

[dev-dependencies]
agentj-protocol = { path = "../agentj-protocol" }
libc = "0.2"
futures = "0.3"
sha2 = "0.10"
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-tungstenite = "0.26"
