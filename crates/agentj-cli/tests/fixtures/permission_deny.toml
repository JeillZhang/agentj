[model]
provider = "mock"

[[model.providers]]
name = "mock"
kind = "mock"
base_url = "mock://local"
api_key_env = ""

[permission]
# Test-only: keep the auto-deny inside the e2e deadline (design default is 60s).
timeout_ms = 800

[permission.tools.bash]
mode = "ask"

[[permission.tools.bash.command_rules]]
effect = "deny"
prefix = "rm -rf"
