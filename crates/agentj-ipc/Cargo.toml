[package]
name = "agentj-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
agentj-core = { path = "../agentj-core", version = "0.1.0" }
agentj-permission = { path = "../agentj-permission", version = "0.1.0" }
agentj-protocol = { path = "../agentj-protocol", version = "0.1.0" }
agentj-question = { path = "../agentj-question", version = "0.1.0" }
async-trait.workspace = true
axum = { version = "0.8", features = ["ws"] }
base64.workspace = true
futures.workspace = true
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11"
tokio = { workspace = true, features = ["sync", "rt", "macros", "io-util", "io-std", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
agentj-session = { path = "../agentj-session", version = "0.1.0" }
agentj-model = { path = "../agentj-model", version = "0.1.0" }
futures.workspace = true
tempfile.workspace = true
tokio-tungstenite = "0.29"
tracing-subscriber = "0.3"

[lints]
workspace = true
