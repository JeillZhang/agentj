[package]
name = "agentj-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
agentj-core = { path = "../agentj-core" }
agentj-permission = { path = "../agentj-permission" }
agentj-protocol = { path = "../agentj-protocol" }
agentj-question = { path = "../agentj-question" }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "io-util", "io-std", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
agentj-session = { path = "../agentj-session" }
agentj-model = { path = "../agentj-model" }
agentj-context = { path = "../agentj-context" }
futures = "0.3"
tokio-tungstenite = "0.26"
