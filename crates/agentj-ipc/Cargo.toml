[package]
name = "agentj-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
agentj-core = { path = "../agentj-core" }
agentj-permission = { path = "../agentj-permission" }
agentj-protocol = { path = "../agentj-protocol" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "io-util", "io-std"] }

[dev-dependencies]
agentj-session = { path = "../agentj-session" }
agentj-model = { path = "../agentj-model" }
agentj-context = { path = "../agentj-context" }
