[package]
name = "agentj-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
agentj-core = { path = "../agentj-core" }
async-trait = "0.1"
bytes = "1"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "io-util"] }
tokio-util = { version = "0.7.19", features = ["io"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
futures = "0.3"
wiremock = "0.6"

[[bench]]
name = "stream_bench"
harness = false
