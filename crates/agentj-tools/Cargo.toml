[package]
name = "agentj-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
agentj-core = { path = "../agentj-core" }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util"] }
libc = "0.2"   # process-group kill (design §工具执行生命周期; Unix-only usage)
regex = "1"     # grep fallback: pattern matching without the `rg` binary
globset = "0.4"   # grep fallback: `include` glob matching
walkdir = "2"   # grep fallback: directory walk

[dev-dependencies]
tempfile = "3"
