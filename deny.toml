# cargo-deny policy. Run with `cargo deny check advisories licenses bans sources`
# from the repository root. The allowlist, the annotated duplicate skips and the
# workspace licence policy are documented in CONTRIBUTING.md / AGENTS.md — this
# file is the enforcement, not the discussion.

[advisories]
yanked = "warn"
ignore = []

[licenses]
# Unlisted licences are denied by default (cargo-deny >= 0.19 dropped the
# explicit `default` key); the allowlist below is therefore an exhaustive
# statement of what may enter the dependency graph.
confidence-threshold = 0.9
# Workspace members are unpublished; their licence comes from
# [workspace.package] license = "MIT OR Apache-2.0".
private = { ignore = true }
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unlicense",
  "MPL-2.0",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Duplicates that cannot be removed without upstream work. Keep this list
# short and explain each entry — an unexplained skip is a silent blind spot.
skip = [
  # ed25519-dalek 2.2 still rides the rand 0.8 / getrandom 0.2 chain while
  # uuid 1.26 pulls getrandom 0.4. Drop these once ed25519-dalek moves up.
  { name = "getrandom", version = "=0.2.17" },
  { name = "getrandom", version = "=0.3.4" },
  { name = "r-efi", version = "=5.3.0" },
  { name = "rand_core", version = "=0.6.4" },
  # Tower/hyper stack still targets the system-config 0.9 API.
  { name = "core-foundation", version = "=0.9.4" },
  # async-trait 0.1.92 is the only proc-macro crate on syn 3 so far.
  { name = "syn", version = "=3.0.4" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# crates.io only. `allow-registry` (not the older `allow`) is the key that
# cargo-deny >=0.20 accepts.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
