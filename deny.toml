# cargo-deny policy. Run with `cargo deny check advisories licenses bans sources`
# from the repository root. The licence allowlist, the duplicate-skip rules and the
# rationale for every setting below are documented in CONTRIBUTING.md; this file is
# the enforcement, not the discussion.

[advisories]
# `yanked` is left at cargo-deny's default (deny): a yanked release must block,
# never be silently downgraded to a warning.
ignore = []

[licenses]
# Unlisted licences are denied by default (cargo-deny >= 0.19 dropped the
# explicit `default` key); the allowlist below is therefore an exhaustive
# statement of what may enter the dependency graph.
confidence-threshold = 0.9
# Workspace members are unpublished; their licence comes from
# [workspace.package] license = "MIT OR Apache-2.0".
private = { ignore = true }
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unlicense",
  "MPL-2.0",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Duplicates that cannot be removed without upstream work. Keep this list
# short and explain each entry — an unexplained skip is a silent blind spot.
skip = [
  # getrandom 0.3.4 rides rand 0.9.5 -> rand_core 0.9.5 (via tokio-tungstenite
  # 0.26/0.29); getrandom 0.4.3 comes from uuid 1.26 and fastrand 2.5 (tempfile
  # 3.27). getrandom 0.2 is lockfile-only: rand_core 0.6.4's `getrandom` feature
  # stays off here, so nothing pulls 0.2 into the built graph.
  { name = "getrandom", version = "=0.3.4" },
  # getrandom 0.3.4's UEFI backend (visible only under `cargo tree --target
  # all`); getrandom 0.4.3 ships r-efi 6.0.0 instead, hence the duplicate.
  { name = "r-efi", version = "=5.3.0" },
  # rand 0.9.5 (via tungstenite 0.29) is still on rand_core 0.9.5, while
  # ed25519-dalek 3.0.0 rides crypto-common 0.2 -> digest 0.11 -> rand_core 0.10.
  { name = "rand_core", version = "=0.9.5" },
  # async-trait 0.1.92 is the only proc-macro crate on syn 3 so far.
  { name = "syn", version = "=3.0.9" },
  # digest 0.11 (agentj-ipc, agentj-cli, ed25519-dalek 3) vs digest 0.10, which
  # only sha1 0.10.7 (axum / tungstenite 0.29) still pins. Once sha1 moves to
  # the RustCrypto 0.11 wave this block collapses back into single versions.
  { name = "digest", version = "=0.10.7" },
  { name = "block-buffer", version = "=0.10.4" },
  { name = "crypto-common", version = "=0.1.7" },
  { name = "cpufeatures", version = "=0.2.17" },
  # base64 0.23.1 comes from reqwest 0.13, while axum 0.8 / hyper-util 0.1 still
  # ask for 0.22.1. Pure transitional overlap until axum bumps its own pin.
  { name = "base64", version = "=0.22.1" },
  # agentj-ipc serves the web dist through tower-http 0.7 (fs + set-header),
  # while reqwest 0.13.5 pins tower-http 0.6 for its own redirect/cookie layers.
  # Drop this entry once reqwest re-exports on 0.7.
  { name = "tower-http", version = "=0.6.11" },
  # toml 1.1 (agentj-config, agentj-plugin) parses through toml_datetime 1.1 and
  # winnow 1.0, whereas toml_edit 0.22 (comment-preserving writes) is still on
  # toml_datetime 0.6 / winnow 0.7. Upstream has not released a toml_edit on the
  # 1.x parser yet.
  { name = "toml_datetime", version = "=0.6.11" },
  { name = "winnow", version = "=0.7.15" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# crates.io only. `allow-registry` (not the older `allow`) is the key that
# cargo-deny >=0.20 accepts.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
